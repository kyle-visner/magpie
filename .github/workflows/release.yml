name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out tagged source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: 1.26.6
          check-latest: false
          cache: true

      - name: Require an annotated tag on current main
        run: |
          test "$(git cat-file -t "${GITHUB_REF_NAME}")" = tag
          git fetch origin main --depth=1
          test "$(git rev-list -n 1 "${GITHUB_REF_NAME}")" = "$(git rev-parse origin/main)"

      - name: Verify release source
        run: |
          go mod verify
          go test -race ./...
          go vet ./...

      - name: Install govulncheck
        env:
          GOBIN: ${{ runner.temp }}/bin
        run: go install golang.org/x/vuln/cmd/govulncheck@v1.6.0

      - name: Scan for reachable vulnerabilities
        run: |
          "${RUNNER_TEMP}/bin/govulncheck" ./...

      - name: Build release archives and checksums
        run: ./scripts/build-release.sh "${GITHUB_REF_NAME}" dist

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "${GITHUB_REF_NAME}"
          dist/*.tar.gz
          dist/SHA256SUMS
          --verify-tag
          --generate-notes
          --title "Magpie ${GITHUB_REF_NAME}"
